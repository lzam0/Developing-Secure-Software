<!DOCTYPE html>
<html>
    <head>
         <link rel="stylesheet" href="/styles.css">
        <title>Health and Lifestyle Blog Sign Up</title>
        <meta charset="utf-8">
        <script src="js/csrf.js"></script>
        <script src="/js/verify.js"></script>
        <script src="js/signUp.js" defer></script>
        <script src="/components/header.js"></script>
        <script src="/components/navbar.js" defer></script>
    </head>
    <body>
        <div id="header"></div>
        
        <header>
            <h1 class="title">Welcome to Health and Lifestyle Blog!</h1>
        </header>

        <main>
        <p class="description">Create an account to continue.</p>

        <div class="login-box">
        <form method="post" id="signup_form">
            <label for="username_input">Username:</label>
            <input type="text" id="username_input" name="username_input" placeholder="Please enter your username...">

            <label for="email_input">Email:</label>
            <input type="email" id="email_input" name="email_input" placeholder="Please enter your email...">

            <label for="confirm_email_input">Confirm Email:</label>
            <input type="email" id="confirm_email_input" name="confirm_email_input" placeholder="Please confirm your email...">

            <label for="password_input">Password:</label>
            <input type="password" id="password_input" name="password_input" placeholder="Please enter your password...">
            <label for="confirm_password_input">Confirm Password:</label>
            <input type="password" id="confirm_password_input" name="confirm_password_input" placeholder="Please confirm your password...">

            <p id="form_error" style="color: red; font-size: 13px; margin-bottom: 10px; display: none;"></p>
            <button id="login_btn" type="submit">Sign Up</button>
        </form>
            <div>
        <div id="message_display" style="display: none; margin-bottom: 15px; padding: 10px; border-radius: 5px; text-align: center; font-family: Arial, sans-serif;"></div>

        <form method="post" id="signup_form">
            </form>
    </div>
        </div>
        <p class="description">Already have an account? <a href="login.html">Log in</a></p>
        </main>
    </body>
</html>
