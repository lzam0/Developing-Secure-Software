<!------------------ HTML ------------------>
<html>
    <head>
        <link rel="stylesheet" href="/styles.css">
        <script src ="js/csrf.js"></script>
        <script src="/js/verify.js"></script>
        <script src="/js/payment.js" defer></script>
        <script src="/js/blog-page.js" defer></script>
        <script src="/components/header.js"></script>
        <script src="/components/navbar.js" defer></script>
        <title>Blog post</title>
    </head>
    <div id="header"></div>
    <body>
        <nav class="topbar">
            <!-- link back home -->
            <a href="/blogListingPage.html" class="back-link">← Back</a>
        </nav>
        <article class="post-wrapper" id="post-wrapper" style="display:none">
            <header class="post-header">
                <span class="post-tag" id="post-tag"></span>
                <h1 class="post-title" id="post-title"></h1>

                <div class="post-meta">
                    <div class="author-information">
                        <div class="author-avatar" id="author-avatar"></div>
                        <div>
                            <p class="author-name" id="author-name"></p>
                            <p class="post-date" id="post-date"></p>
                        </div>
                    </div>
                    <a href="#" id="edit-button" class="edit-button" style="display:none">Edit Post</a>
                </div>
            </header>
            <hr class="post-divider"/>
            <section class="post-body" id="post-body"></section>
            <div class="paywall-cta" id="paywall-cta" style="display:none">
                <p class="paywall-text">Subscribe to read the full post</p>
                <button id="subscribe-btn" class="paywall-button" type="button">Subscribe</button>
            </div>
            <hr class="post-divider"/>
            <footer class="post-footer">
                <div class="post-tag-row" id="post-tag-row"></div>
            </footer>
        </article>
        <p id="post-error" style="display:none;text-align:center;margin-top:3rem;color:#6b4c3b;"></p>
    </body>
</html>

<!------------------ CSS ------------------>
<head>
    <style>
        body {
            font-family: 'DM Sans', sans-serif;
            background: #faf7f2;
            color: #3d2b1f;
            min-height: 100vh;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #fff9f3;
            border-bottom: 1px solid #e8ede9;
            display: flex;
            align-items: center;
            padding: 0 2rem;
            height: 62px;
            box-shadow: 0 1px 12px rgba(61, 43, 21, 0.06);
        }

        .back-link {
            font-size: 1rem;
            font-weight: 500;
            color: #6b4c3b;
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #7a9e7e;
        }

        .post-wrapper {
            max-width: 800px;
            margin: 0 auto 5rem;
            padding: 0 1.5rem;
        }

        .image {
            margin: 2.5rem 0 0;
            border-radius: 14px;
            overflow: hidden;
        }

        .image-placeholder {
            width: 100%;
            height: 360px;
            background: rgba(184, 212, 187, 0.15);
            border: 2px dashed #b8d4bb;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-placeholder p {
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #7a9e7e;
        }

        .post-header {
            margin-top: 2rem;
        }

        .post-tag {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            background: #7a9e7e;
            color: #fff;
            padding: 4px 12px;
            border-radius: 5px;
            margin-bottom: 1rem;
        }

        .tag-secondary {
            background: transparent;
            color: #7a9e7e;
            border: 1.5px solid #b8d4bb;
        }

        .post-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.4rem;
            font-weight: 700;
            color: #3d2b1f;
            line-height: 1.25;
            margin-bottom: 1.5rem;
            letter-spacing: -0.02em;
        }

        .post-meta {
            margin-bottom: 0.5rem;
        }

        .author-information {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .author-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #7a9e7e;
            color: #fff;
            font-family: 'Playfair Display', serif;
            font-size: 0.85rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .author-name {
            font-size: 0.9rem;
            font-weight: 500;
            color: #3d2b1f;
        }

        .post-date {
            font-size: 0.8rem;
            color: #6b4c3b;
            margin-top: 2px;
        }

        .post-divider {
            border: none;
            border-top: 1px solid #e8ede9;
            margin: 2rem 0;
        }

        .post-body {
            font-size: 1.05rem;
            line-height: 1.85;
            color: #3d2b1f;
        }

        .post-lead {
            font-size: 1.05rem;
            line-height: 1.75;
            color: #3d2b1f;
            margin-bottom: 1.6rem;
        }

        .post-body p {
            margin-bottom: 1.4rem;
        }

        .inline-image{
            margin: 2rem 0;
            border-radius: 14px;
            overflow: hidden;
        }

        .inline-placeholder {
            width: 100%;
            height: 240px;
            background: rgba(184, 212, 187, 0.12);
            border: 2px dashed #b8d4bb;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .inline-placeholder p {
            font-size: 0.72rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #6b4c3b;
            margin: 0;
        }

        .post-footer {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .post-tag-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .post-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .edit-button {
            font-size: 0.8rem;
            font-weight: 500;
            color: #7a9e7e;
            border: 1.5px solid #b8d4bb;
            border-radius: 8px;
            padding: 0.3rem 0.85rem;
            text-decoration: none;
            transition: all 0.2s;
        }

        .edit-button:hover {
            background: #7a9e7e;
            color: #fff;
        }

        .paywall-cta {
            margin: 2rem 0;
            padding: 2.5rem;
            background: rgba(184, 212, 187, 0.12);
            border: 1.5px solid #b8d4bb;
            border-radius: 14px;
            text-align: center;
        }

        .paywall-text {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            color: #3d2b1f;
            margin-bottom: 1rem;
        }

        .paywall-button {
            display: inline-block;
            background: #7a9e7e;
            color: #fff;
            font-size: 0.875rem;
            font-weight: 500;
            padding: 0.55rem 1.4rem;
            border-radius: 10px;
            text-decoration: none;
            transition: background 0.2s;
        }

        .paywall-button:hover {
            background: #6a8e6e;
        }
    </style>
</head>
