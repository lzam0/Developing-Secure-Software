<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="/styles.css">
    <title>Health Metrics Tracker</title>
    <meta charset="utf-8">
    <script src="/components/header.js"></script>
    <script src="/components/navbar.js" defer></script>
</head>
<body>
    <div id="header"></div>



<h1 class="title">Health Metrics Tracker</h1>

<div class="action-bar">
    <button class="btn add-btn" onclick="openModal()">+ Add New Metric</button>
</div>

<div id="myModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h2>Add Health Metric</h2>
        <form id="entryForm" class="form-group">
            <label for="date">Date:</label>
            <input type="date" id="date" name="date" required>
            
            <label for="metric">Health Metric (e.g. Weight, BP):</label>
            <input type="text" id="metric" name="metric" required>
            
            <label for="current">Current Value:</label>
            <input type="text" id="current" name="current" required>
            
            <label for="goal">Goal Value:</label>
            <input type="text" id="goal" name="goal">
            
            <label for="notes">Notes:</label>
            <textarea id="notes" name="notes"></textarea>
            
            <button type="submit" class="btn">Add Entry</button>
        </form>
    </div>
</div>

<div class="table-container"> 
    <table id="trackerTable">
        <thead>
            <tr class="t-header">
                <th>Date</th>
                <th>Metric</th>
                <th>Current</th>
                <th>Goal</th>
                <th>Notes</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            </tbody>
    </table>
</div>

<script>
    const modal = document.getElementById("myModal");
    const entryForm = document.getElementById("entryForm");
    const tableBody = document.getElementById("tableBody");

    function openModal() {
        modal.style.display = "flex";
    }

    function closeModal() {
        modal.style.display = "none";
        entryForm.reset();
    }

    window.onclick = function(event) {
        if (event.target == modal) closeModal();
    }

    entryForm.onsubmit = function(e) {
        e.preventDefault();

        const entry = {
            date: document.getElementById("date").value,
            metric: document.getElementById("metric").value,
            current: document.getElementById("current").value,
            goal: document.getElementById("goal").value,
            notes: document.getElementById("notes").value
        };

        addTableRow(entry);
        closeModal();
    };

    function addTableRow(data) {
        const row = document.createElement("tr");
        row.innerHTML = `
            <td>${data.date}</td>
            <td><strong>${data.metric}</strong></td>
            <td>${data.current}</td>
            <td>${data.goal || '-'}</td>
            <td><small>${data.notes}</small></td>
            <td>
                <button class="delete-btn" onclick="deleteRow(this)">Delete</button>
            </td>
        `;
        tableBody.appendChild(row);
    }

    function deleteRow(button) {
        if (confirm("Remove this metric entry?")) {
            const row = button.closest("tr");
            row.style.opacity = "0";
            setTimeout(() => row.remove(), 300);
        }
    }
</script>
</body>
</html>

<style>
body {
    background-color: #f4f7f6;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #333;
    margin: 0;
    padding: 0;
}

 .title {
        margin-top: 50px;
        text-align: center;
        font-family: 'Arial', sans-serif;
        color: #333;
    }



.table-container {
    max-width: 1000px;
    margin: 20px auto;
    background: white;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.05);
}

#trackerTable {
    width: 100%;
    border-collapse: collapse;
}

#trackerTable th {
    text-align: left;
    padding: 15px;
    border-bottom: 2px solid #edf2f0;
    color: #2e7d32;
}

#trackerTable td {
    padding: 15px;
    border-bottom: 1px solid #eee;
}


.action-bar { text-align: center; margin-top: 20px; }

.add-btn {
    background-color: #4CAF50;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.2s;
}

.add-btn:hover { transform: scale(1.05); background-color: #45a049; }

.delete-btn {
    background-color: #ffeded;
    color: #d32f2f;
    border: 1px solid #ffcdd2;
    padding: 5px 10px;
    border-radius: 4px;
    cursor: pointer;
}

.delete-btn:hover { background-color: #d32f2f; color: white; }

/* Transitions */
tr { transition: opacity 0.3s ease; }

/* Modal Background */
.modal {
    display: none; 
    position: fixed; 
    z-index: 1000; 
    left: 0;
    top: 0;
    width: 100%; 
    height: 100%; 
    background-color: rgba(0,0,0,0.5); /* Dimmed background */
    justify-content: center;
    align-items: center;
}

/* Modal Box */
.modal-content {
    background-color: white;
    padding: 30px;
    border-radius: 12px;
    width: 400px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

.close {
    float: right;
    font-size: 24px;
    cursor: pointer;
    color: #888;
}

.form-group label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
    font-size: 14px;
}

.form-group input, .form-group textarea {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    border: 1px solid #ddd;
    border-radius: 4px;
    box-sizing: border-box; /* Prevents input from sticking out */
}

</style>
