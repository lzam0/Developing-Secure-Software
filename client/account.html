<html>
    <head>
        <link rel="stylesheet" href="/styles.css">
        <title>Health and Lifestyle Blog</title>
        <link rel="stylesheet" href="/style.css">
        <script src="/js/verify.js"></script>
        <script src="/js/auth-guard.js"></script>
        <script src="/js/account.js" defer></script>
        <script src="/components/header.js"></script>
        <script src="/components/navbar.js" defer></script>
    </head>
    <body>
        <div id="header"></div>
        
        <main>
            <h1 class="title">Account & Profile Settings</h1>
            <p class="description">Manage your account and profile information here.</p>

            <div>
                <h2>Profile Information</h2>
                
        
                <div class="user-info">
                    <div class="form">

                    <label>Full Name:</label>
                    <input type="text" id="full_name_input" value="John Doe" readonly>
                    <label>Username:</label>
                    <input type="text" id="username_input" value="user123" readonly>
                    <label>Bio:</label>
                    <textarea id="bio_input" readonly> A passionate blogger about health and lifestyle.</textarea>
                </div>
                    
                <button id="edit_profile_btn">Edit Profile</button>

            </div>

            <div>
                <h2>Account Settings</h2>
                <div class="form">
                    <label>Email:</label>
                    <input type="email" id="email_input" value="user123@example.com" readonly>
                    
                    <div id="password_change_area" style="display: none; margin-top: 20px; border-top: 1px solid #ddd; padding-top: 15px;">
            <h3>Update Password</h3>
                <label>Current Password:</label>
                    <input type="password" id="password_input" >
                
                <label>New Password:</label>
                <input type="password" id="new_password_input">
                
                <label>Confirm New Password:</label>
                <input type="password" id="confirm_password_input">
                
                <div style="margin-top: 10px;">
                    <button id="save_password_btn" class="save-btn">Save New Password</button>
                    <button id="cancel_password_btn" class="cancel-btn">Cancel</button>
                </div>
                </div>
                <button id="update_email_btn">Update Email</button>
                <button id="change_password_btn">Change Password</button>
                <button id="delete_account_btn">Delete Account</button>
            </div>




        </main>
    </body> 
</html>

<style>



.title {
    font-size: 26px;
        text-align: center;
        font-family: 'Arial', sans-serif;
        color: #371717;
        margin-top: 20px;
    }

    .form{
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 20px;
    }

   
    main{
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;}

     .description {
        text-align: center;
        font-family: 'Arial', sans-serif;
        color: #371717;
        margin-top: 20px;
     }

     .user-info {
        margin-top: 20px;
        font-family: 'Arial', sans-serif;
        color: #371717;
        list-style-type: none;
     }


     #change_password_btn, #update_email_btn, #edit_profile_btn {
        display: inline-block;
        padding: 10px 20px;
        background-color: #485b49;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        font-family: 'Arial', sans-serif;
     }

     #delete_account_btn {
        display: inline-block;
        padding: 10px 20px;
        background-color: #c0392b;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        font-family: 'Arial', sans-serif;
     }

     #password_input, #username_input, #email_input, #full_name_input, #bio_input, #new_password_input, #confirm_password_input {
         margin-top: 10px;
         padding: 5px;
         border: 1px solid #ccc;
         border-radius: 5px;
        margin-bottom: 20px;
        padding: 5px;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    input:not([readonly]), textarea:not([readonly]) {
    background-color: #fff;
    border: 2px solid #27ae60 !important;
    outline: none;
}
</style>
