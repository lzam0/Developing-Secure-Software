<!DOCTYPE html>
<html>
    <head>
         <link rel="stylesheet" href="/styles.css">
        <title>Health and Lifestyle Blog Login</title>
        <meta charset="utf-8">
        <script src="js/signIn.js" defer></script>
        <script src="/components/header.js"></script>
        <script src="/components/navbar.js" defer></script>
    </head>
    <body>
        
        <div id="header"></div>

        <main>
        <p class="description">Please enter your username and password to continue.</p>

        <div class="login-box">
        <form method="post" id="login_form">
            <label for="username_input">Username:</label>
            <input type="text" id="username_input" name="username_input" placeholder="Please enter your username...">

            <label for="password_input">Password:</label>
            <input type="password" id="password_input" name="password_input" placeholder="Please enter your password...">

            <button id="login_btn" type="submit">Log in</button>
        </form>
        </div>
        <p class="description">Dont have an account? <a href="signup.html">Sign up</a></p>
        </main>
    </body>
</html>
