<!DOCTYPE html>
<html>
    <head>
         <link rel="stylesheet" href="/styles.css">
        <title>Health and Lifestyle Blog - Medication Tracker</title>
        <meta charset="utf-8">
        <script src="/js/verify.js"></script>
        <script src="/js/auth-guard.js"></script>
        <script src="/js/medication-tracker.js" defer></script>
        <script src="/components/header.js"></script>
        <script src="/components/navbar.js" defer></script>
       
    </head>
     <div id="header"></div>
    <body>

       


<h1 class="title">Medication/Supplement Tracker</h1>

<div class="action-bar">
    <button class="btn add-btn" id="open-modal-button" type="button">+ Add New Entry</button>
</div>

<div class="table-container"> 
    <table id="trackerTable">
        <thead>
            <tr class="t-header">
                <th>Date</th>
                <th>Medication/Supplement</th>
                <th>Dosage</th>
                <th>Frequency</th>
                <th>Notes</th>
                <th>Actions</th> </tr>
        </thead>
        <tbody id="tableBody">
            </tbody>
    </table>
</div>

<div id="myModal" class="modal">
    <div class="modal-content">
        <span class="close" id="close-modal-button">&times;</span>
        <h2>Add Medication/Supplement</h2>
        <form id="entryForm" class="form-group">
            <label for="date">Date:</label>
            <input type="date" id="date" name="date" required>
            
            <label for="medication">Medication/Supplement:</label>
            <input type="text" id="medication" name="medication" required>
            
            <label for="dosage">Dosage:</label>
            <input type="text" id="dosage" name="dosage" required>
            
            <label for="frequency">Frequency:</label>
            <input type="text" id="frequency" name="frequency">
            
            <label for="notes">Notes:</label>
            <textarea id="notes" name="notes"></textarea>
            
            <button type="submit" class="btn">Add Entry</button>
        </form>
    </div>
</div>

    </body>
</html>

<style>
body {
    background-color: #f4f7f6;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #333;
    margin: 0;
    padding: 0;
}
 .title {
        margin-top: 50px;
        text-align: center;
        font-family: 'Arial', sans-serif;
        color: #333;
    }


.table-container {
    max-width: 1000px;
    margin: 20px auto;
    background: white;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.05);
}

#trackerTable {
    width: 100%;
    border-collapse: collapse;
}

#trackerTable th {
    text-align: left;
    padding: 15px;
    border-bottom: 2px solid #edf2f0;
    color: #2e7d32;
}

#trackerTable td {
    padding: 15px;
    border-bottom: 1px solid #eee;
}


.action-bar { text-align: center; margin-top: 20px; }

.add-btn {
    background-color: #4CAF50;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.2s;
}

.add-btn:hover { transform: scale(1.05); background-color: #45a049; }

.delete-btn {
    background-color: #ffeded;
    color: #d32f2f;
    border: 1px solid #ffcdd2;
    padding: 5px 10px;
    border-radius: 4px;
    cursor: pointer;
}

.delete-btn:hover { background-color: #d32f2f; color: white; }

/* Transitions */
tr { transition: opacity 0.3s ease; }

/* Modal Background */
.modal {
    display: none; 
    position: fixed; 
    z-index: 1000; 
    left: 0;
    top: 0;
    width: 100%; 
    height: 100%; 
    background-color: rgba(0,0,0,0.5); /* Dimmed background */
    justify-content: center;
    align-items: center;
}

/* Modal Box */
.modal-content {
    background-color: white;
    padding: 30px;
    border-radius: 12px;
    width: 400px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

.close {
    float: right;
    font-size: 24px;
    cursor: pointer;
    color: #888;
}

.form-group label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
    font-size: 14px;
}

.form-group input, .form-group textarea {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    border: 1px solid #ddd;
    border-radius: 4px;
    box-sizing: border-box; /* Prevents input from sticking out */
}

</style>
