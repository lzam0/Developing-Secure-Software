<!DOCTYPE html>
<html>
    <head>
        <title>Health and Lifestyle Blog - Medication Tracker</title>
        <meta charset="utf-8">
       
    </head>
    <body>
<nav class="navbar">
    <a href="/pages/index.html">Home</a>
    <a href="/pages/healthdiary.html" class="current">Diary</a>
    <a href="/pages/blogs.html">Blogs</a>
</nav>

<h1 class="title">Medication/Supplement Tracker</h1>

<div class="action-bar">
    <button class="btn add-btn" onclick="openModal()">+ Add New Entry</button>
</div>

<div class="table-container"> 
    <table id="trackerTable">
        <thead>
            <tr class="t-header">
                <th>Date</th>
                <th>Medication/Supplement</th>
                <th>Dosage</th>
                <th>Frequency</th>
                <th>Notes</th>
                <th>Actions</th> </tr>
        </thead>
        <tbody id="tableBody">
            </tbody>
    </table>
</div>

<div id="myModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h2>Add Medication/Supplement</h2>
        <form id="entryForm" class="form-group">
            <label for="date">Date:</label>
            <input type="date" id="date" name="date" required>
            
            <label for="medication">Medication/Supplement:</label>
            <input type="text" id="medication" name="medication" required>
            
            <label for="dosage">Dosage:</label>
            <input type="text" id="dosage" name="dosage" required>
            
            <label for="frequency">Frequency:</label>
            <input type="text" id="frequency" name="frequency">
            
            <label for="notes">Notes:</label>
            <textarea id="notes" name="notes"></textarea>
            
            <button type="submit" class="btn">Add Entry</button>
        </form>
    </div>
</div>

<script>
const modal = document.getElementById("myModal");
const entryForm = document.getElementById("entryForm");
const tableBody = document.getElementById("tableBody");

// pen/Close modal functions
function openModal() {
    modal.style.display = "flex";
}

function closeModal() {
    modal.style.display = "none";
    entryForm.reset();
}

// close modal if user clicks outside of it
window.onclick = (event) => {
    if (event.target == modal) closeModal();
}

// handle Form Submission
entryForm.onsubmit = function(e) {
    e.preventDefault();

    const entry = {
        date: document.getElementById("date").value,
        medication: document.getElementById("medication").value,
        dosage: document.getElementById("dosage").value,
        frequency: document.getElementById("frequency").value,
        notes: document.getElementById("notes").value
    };

    addTableRow(entry);
    closeModal();
};

// create Table Row Function
function addTableRow(data) {
    const row = document.createElement("tr");

    row.innerHTML = `
        <td>${data.date}</td>
        <td>${data.medication}</td>
        <td>${data.dosage}</td>
        <td>${data.frequency}</td>
        <td><small>${data.notes}</small></td>
        <td>
            <button class="delete-btn" onclick="deleteRow(this)">Delete</button>
        </td>
    `;

    tableBody.appendChild(row);
}

// delete Row Function
function deleteRow(button) {
    if (confirm("Are you sure you want to remove this entry?")) {
        const row = button.closest("tr");
        row.style.opacity = "0"; // fade out effect
        setTimeout(() => row.remove(), 300);
    }
}
</script>
    </body>
</html>
